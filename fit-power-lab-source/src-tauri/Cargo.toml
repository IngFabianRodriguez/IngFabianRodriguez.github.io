[package]
name = "fit-power-lab"
version = "0.1.0"
description = "Desktop shell of FIT power lab"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The folder the user picks with the system dialog is added to the read scope of the fs plugin.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
