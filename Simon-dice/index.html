<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Simon Dice</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a84ff' rx='20' width='100' height='100'/><text y='70' x='50' text-anchor='middle' font-size='60'>🎮</text></svg>" />
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#000000;--surface-1:#1c1c1e;--surface-2:#2c2c2e;--surface-3:#3a3a3c;
  --label:#f5f5f7;--secondary:#98989d;--tertiary:#636366;
  --blue:#0a84ff;--blue-fill:rgba(10,132,255,0.15);
  --green:#30d158;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;
  --purple:#bf5af2;--pink:#ff375f;--cyan:#64d2ff;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-apple:cubic-bezier(0.25,0.1,0.25,1.0);
}

[data-theme="light"]{
  --bg:#f5f5f7;--surface-1:#ffffff;--surface-2:#f0f0f2;--surface-3:#e5e5ea;
  --label:#1c1c1e;--secondary:#6e6e73;--tertiary:#aeaeb2;
}

html,body{
  height:100%;font-family:var(--font);background:var(--bg);color:var(--label);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#48484a;border-radius:3px}
::selection{background:var(--blue-fill)}

/* ── Layout ── */
.app{
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:20px 16px;gap:20px;transition:opacity 0.3s;
}

.app.fade-out{opacity:0;pointer-events:none}

/* ── Header Stats ── */
.stats{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  width:100%;max-width:500px;
}
.stat{
  background:var(--surface-1);border-radius:var(--radius-md);
  padding:8px 16px;text-align:center;min-width:80px;border:1px solid var(--surface-3);
  flex:1;
}
.stat__label{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--secondary);margin-bottom:2px;
}
.stat__value{
  font-size:22px;font-weight:700;
}
.stat__value--blue{color:var(--blue)}
.stat__value--red{color:var(--red)}
.stat__value--green{color:var(--green)}
.stat__value--orange{color:var(--orange)}
.stat__value--cyan{color:var(--cyan)}

/* ── Timer (time attack) ── */
.timer-bar{
  width:100%;max-width:500px;height:6px;background:var(--surface-3);
  border-radius:3px;overflow:hidden;display:none;
}
.timer-bar__fill{
  height:100%;background:var(--green);border-radius:3px;
  transition:width 0.1s linear,background 0.3s;
  width:100%;
}
.timer-bar__fill.warning{background:var(--orange)}
.timer-bar__fill.danger{background:var(--red)}

/* ── Status bar ── */
.status{
  font-size:14px;color:var(--secondary);height:20px;text-align:center;
}
.status--blink{animation:blink 1s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Turn indicator (2P) ── */
.turn-indicator{
  font-size:16px;font-weight:600;color:var(--cyan);height:24px;display:none;
}
.turn-indicator.p1{color:var(--blue)}
.turn-indicator.p2{color:var(--pink)}

/* ── Game Board ── */
.board-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;width:100%;
}

.board{
  display:grid;gap:8px;
  width:min(70vmin,380px);height:min(70vmin,380px);
}

.board[data-size="3"]{grid-template-columns:repeat(3,1fr)}
.board[data-size="4"]{grid-template-columns:repeat(4,1fr)}
.board[data-size="5"]{grid-template-columns:repeat(5,1fr)}

.cell{
  border-radius:var(--radius-md);cursor:pointer;
  transition:transform 0.12s var(--ease-spring),filter 0.12s var(--ease-apple),
              box-shadow 0.12s var(--ease-apple);
  position:relative;overflow:hidden;border:none;outline:none;
  opacity:0;transform:scale(0) translateY(100px);
}
.cell.entry{
  opacity:1;transform:scale(1) translateY(0);
  transition:opacity 0.4s var(--ease-spring),transform 0.4s var(--ease-spring),
              box-shadow 0.15s;
}
.cell::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:rgba(255,255,255,0);transition:background 0.12s;
}
.cell:active::after{background:rgba(255,255,255,0.15)}
.cell.light{
  transform:scale(0.95);filter:brightness(1.7);
  box-shadow:0 0 28px 8px currentColor;
}
.cell.disabled{pointer-events:none;opacity:0.5}
.cell.locked{opacity:0.3;pointer-events:none}

/* ── Cell Colors ── */
.cell-0{background:#22a6b3;color:#22a6b3}
.cell-1{background:#be2edd;color:#be2edd}
.cell-2{background:#f0932b;color:#f0932b}
.cell-3{background:#6ab04c;color:#6ab04c}
.cell-4{background:#eb4d4b;color:#eb4d4b}
.cell-5{background:#30336b;color:#30336b}
.cell-6{background:#f9ca24;color:#f9ca24}
.cell-7{background:#6c5ce7;color:#6c5ce7}
.cell-8{background:#00b894;color:#00b894}
.cell-9{background:#e17055;color:#e17055}
.cell-10{background:#0984e3;color:#0984e3}
.cell-11{background:#d63031;color:#d63031}
.cell-12{background:#00cec9;color:#00cec9}
.cell-13{background:#e84393;color:#e84393}
.cell-14{background:#55a3ff;color:#55a3ff}
.cell-15{background:#fd79a8;color:#fd79a8}
.cell-16{background:#a29bfe;color:#a29bfe}
.cell-17{background:#00b894;color:#00b894}
.cell-18{background:#e17055;color:#e17055}
.cell-19{background:#74b9ff;color:#74b9ff}
.cell-20{background:#fdcb6e;color:#fdcb6e}
.cell-21{background:#fab1a0;color:#fab1a0}
.cell-22{background:#55efc4;color:#55efc4}
.cell-23{background:#a29bfe;color:#a29bfe}
.cell-24{background:#fd79a8;color:#fd79a8}

/* ── Setup Panel ── */
.setup{
  background:var(--surface-1);border-radius:var(--radius-xl);
  padding:24px;width:min(460px,100%);border:1px solid var(--surface-3);
  display:flex;flex-direction:column;gap:16px;
  animation:scaleIn 0.35s var(--ease-spring);
}
@keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.setup__title{
  font-size:22px;font-weight:700;text-align:center;letter-spacing:-0.01em;
}

.setup__group{display:flex;flex-direction:column;gap:6px}

.setup__label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--secondary);
}

.option-row{display:flex;gap:6px}

.option-btn{
  flex:1;padding:9px 6px;border-radius:var(--radius-md);
  border:1px solid var(--surface-3);background:var(--surface-2);
  color:var(--secondary);font-size:12px;font-weight:500;cursor:pointer;
  transition:all 0.15s var(--ease-apple);font-family:var(--font);
  -webkit-font-smoothing:antialiased;
}
.option-btn:hover{background:var(--surface-3);color:var(--label)}
.option-btn.selected{
  background:var(--blue-fill);border-color:var(--blue);color:var(--blue);font-weight:600;
}

.option-btn.mode-btn{min-width:0;font-size:11px;padding:10px 4px}

.difficulty-desc{
  font-size:11px;color:var(--tertiary);text-align:center;margin-top:-4px;
}

/* ── Power-ups ── */
.powerups{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px;
  padding:4px 0;
}
.powerup-btn{
  display:flex;align-items:center;gap:4px;padding:6px 12px;
  border-radius:var(--radius-md);border:1px solid var(--surface-3);
  background:var(--surface-2);color:var(--label);font-size:13px;
  font-weight:600;cursor:pointer;font-family:var(--font);
  transition:all 0.15s;position:relative;
}
.powerup-btn:hover{background:var(--surface-3);transform:scale(1.05)}
.powerup-btn:active{transform:scale(0.95)}
.powerup-btn.used{
  opacity:0.4;pointer-events:none;border-color:var(--tertiary);
}
.powerup-btn.earned{
  border-color:var(--green);background:rgba(48,209,88,0.1);
  color:var(--green);animation:pulse 0.5s var(--ease-spring);
}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ── Theme toggle ── */
.theme-toggle{
  position:fixed;top:12px;right:12px;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--surface-3);
  background:var(--surface-1);color:var(--label);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;z-index:50;
}
.theme-toggle:hover{background:var(--surface-2);transform:scale(1.1)}
.theme-toggle:active{transform:scale(0.9)}

/* ── Nav buttons (top bar) ── */
.top-bar{
  position:fixed;top:12px;left:12px;display:flex;gap:8px;z-index:50;
}
.top-btn{
  padding:8px 12px;border-radius:var(--radius-md);
  border:1px solid var(--surface-3);background:var(--surface-1);
  color:var(--label);font-size:12px;font-weight:600;cursor:pointer;
  font-family:var(--font);transition:all 0.2s;
}
.top-btn:hover{background:var(--surface-2)}

/* ── Play Button ── */
.btn-play{
  width:100%;padding:13px;border-radius:var(--radius-md);border:none;
  background:var(--blue);color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;font-family:var(--font);-webkit-font-smoothing:antialiased;
  transition:background 0.15s,transform 0.12s var(--ease-spring);
}
.btn-play:hover{background:#2680ff;transform:scale(1.01)}
.btn-play:active{transform:scale(0.98)}
.btn-play:disabled{background:var(--surface-3);color:var(--tertiary);cursor:not-allowed;transform:none}

/* ── Lives ── */
.lives{display:flex;gap:5px;justify-content:center;}
.life{
  width:20px;height:20px;border-radius:50%;background:var(--red);
  transition:all 0.3s var(--ease-spring);
}
.life.lost{background:var(--surface-3);transform:scale(0.75)}

/* ── Overlay / Modal ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal{
  background:var(--surface-1);border-radius:var(--radius-xl);
  padding:32px 24px;width:min(380px,90vw);border:1px solid var(--surface-3);
  text-align:center;animation:scaleIn 0.25s var(--ease-spring);max-height:90vh;overflow-y:auto;
}
@keyframes scaleIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}

.modal__icon{font-size:52px;margin-bottom:10px}
.modal__title{font-size:24px;font-weight:700;margin-bottom:6px}
.modal__score{font-size:44px;font-weight:700;color:var(--orange);margin:10px 0}
.modal__subtitle{font-size:13px;color:var(--secondary);margin-bottom:20px}
.modal__stats{
  display:flex;justify-content:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;
}
.modal__stat{
  background:var(--surface-2);border-radius:var(--radius-md);
  padding:8px 14px;border:1px solid var(--surface-3);
}
.modal__stat-label{font-size:10px;text-transform:uppercase;color:var(--secondary);letter-spacing:0.05em}
.modal__stat-value{font-size:18px;font-weight:700;color:var(--label);margin-top:2px}

.modal__btn{
  width:100%;padding:12px;border-radius:var(--radius-md);border:none;
  background:var(--blue);color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;font-family:var(--font);margin-bottom:8px;
  transition:background 0.15s;
}
.modal__btn:hover{background:#2680ff}
.modal__btn--ghost{
  background:var(--surface-2);color:var(--secondary);margin-bottom:0;
}
.modal__btn--ghost:hover{background:var(--surface-3);color:var(--label)}

/* ── Leaderboard ── */
.leaderboard{
  text-align:left;margin:12px 0;border-radius:var(--radius-md);
  overflow:hidden;border:1px solid var(--surface-3);
}
.leaderboard__title{
  font-size:13px;font-weight:700;padding:10px 14px;
  background:var(--surface-2);color:var(--label);text-align:center;
}
.leaderboard__row{
  display:flex;align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--surface-3);gap:10px;font-size:13px;
}
.leaderboard__row:last-child{border-bottom:none}
.leaderboard__rank{
  font-weight:700;color:var(--secondary);min-width:24px;
}
.leaderboard__rank.gold{color:var(--yellow)}
.leaderboard__rank.silver{color:#c0c0c0}
.leaderboard__rank.bronze{color:#cd7f32}
.leaderboard__name{flex:1;font-weight:500}
.leaderboard__score{color:var(--orange);font-weight:700}
.leaderboard__mode{font-size:10px;color:var(--tertiary);text-transform:uppercase}

/* ── Achievements ── */
.achievements{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;
}
.achievement{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px;background:var(--surface-2);border-radius:var(--radius-md);
  border:1px solid var(--surface-3);min-width:72px;opacity:0.4;
  transition:all 0.3s;
}
.achievement.unlocked{
  opacity:1;border-color:var(--green);background:rgba(48,209,88,0.08);
}
.achievement__icon{font-size:24px}
.achievement__name{font-size:9px;text-transform:uppercase;color:var(--secondary);letter-spacing:0.04em;text-align:center}
.achievement.unlocked .achievement__name{color:var(--green)}

/* ── Particles ── */
#particles{
  position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;
}

.confetti{
  position:absolute;width:10px;height:10px;border-radius:2px;
  animation:confettiFall 3s ease-out forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

.red-x{
  position:absolute;font-size:32px;font-weight:900;color:var(--red);
  animation:redXFall 2s ease-out forwards;
}
@keyframes redXFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(30deg);opacity:0}
}

/* ── Online Multiplayer ── */
.online-panel{
  background:var(--surface-1);border-radius:var(--radius-xl);
  padding:24px;width:min(460px,100%);border:1px solid var(--surface-3);
  display:flex;flex-direction:column;gap:16px;
  animation:scaleIn 0.35s var(--ease-spring);
}
.online-panel__title{
  font-size:20px;font-weight:700;text-align:center;
}
.online-code{
  font-size:36px;font-weight:800;letter-spacing:0.15em;
  color:var(--blue);text-align:center;padding:16px;
  background:var(--surface-2);border-radius:var(--radius-lg);
  border:1px solid var(--surface-3);
}
.join-input{
  width:100%;padding:12px;border-radius:var(--radius-md);
  border:1px solid var(--surface-3);background:var(--surface-2);
  color:var(--label);font-size:18px;font-weight:600;text-align:center;
  font-family:var(--font);letter-spacing:0.1em;
  outline:none;transition:border-color 0.2s;
}
.join-input:focus{border-color:var(--blue)}
.join-input::placeholder{color:var(--tertiary);letter-spacing:0.02em}

.waiting-screen{
  text-align:center;padding:20px;
}
.waiting-screen__text{color:var(--secondary);margin-top:12px;font-size:14px}
.spinner{
  width:48px;height:48px;border:4px solid var(--surface-3);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

.online-scoreboard{
  display:flex;justify-content:space-around;padding:16px;
  background:var(--surface-2);border-radius:var(--radius-lg);
  border:1px solid var(--surface-3);
}
.online-player{
  text-align:center;
}
.online-player__name{font-size:12px;color:var(--secondary);text-transform:uppercase;letter-spacing:0.05em}
.online-player__score{font-size:32px;font-weight:700;color:var(--blue)}
.online-player__score.p2{color:var(--pink)}

/* ── Install prompt ── */
.install-prompt{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--surface-1);border:1px solid var(--surface-3);
  border-radius:var(--radius-lg);padding:12px 20px;
  display:none;align-items:center;gap:12px;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);max-width:90vw;
  animation:slideUp 0.4s var(--ease-spring);
}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}}
.install-prompt.show{display:flex}
.install-prompt__text{font-size:13px;color:var(--label)}
.install-prompt__btn{
  padding:8px 16px;border-radius:var(--radius-md);border:none;
  background:var(--blue);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font);white-space:nowrap;
}
.install-prompt__close{
  background:none;border:none;color:var(--tertiary);font-size:18px;
  cursor:pointer;padding:4px;line-height:1;
}

/* ── Responsive ── */
@media(max-height:700px){
  .app{gap:10px;padding:10px}
  .setup{padding:16px}
  .stat{padding:6px 10px}
  .stat__value{font-size:18px}
}
@media(max-width:380px){
  .setup{padding:16px}
  .option-btn{font-size:11px;padding:8px 4px}
}
  </style>
</head>
<body>

<!-- Theme toggle -->
<button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙</button>

<!-- Top bar -->
<div class="top-bar" id="topBar" style="display:none;">
  <button class="top-btn" onclick="showStats()">📊 Stats</button>
  <button class="top-btn" onclick="showLeaderboard()">🏆 Top</button>
  <button class="top-btn" onclick="showAchievements()">🏅 Logros</button>
</div>

<div class="app" id="app">

  <!-- ── STATS BAR ── -->
  <div class="stats" id="statsBar">
    <div class="stat">
      <div class="stat__label">Nivel</div>
      <div class="stat__value stat__value--blue" id="statLevel">1</div>
    </div>
    <div class="stat">
      <div class="stat__label">Puntos</div>
      <div class="stat__value stat__value--orange" id="statScore">0</div>
    </div>
    <div class="stat" id="livesStat">
      <div class="stat__label">Vidas</div>
      <div class="lives" id="livesContainer">
        <div class="life" id="life0"></div>
        <div class="life" id="life1"></div>
        <div class="life" id="life2"></div>
      </div>
    </div>
  </div>

  <!-- ── TIMER BAR ── -->
  <div class="timer-bar" id="timerBar">
    <div class="timer-bar__fill" id="timerFill"></div>
  </div>

  <!-- ── STATUS ── -->
  <div class="status" id="statusText">Configura y presiona JUGAR</div>
  <div class="turn-indicator" id="turnIndicator"></div>

  <!-- ── POWER-UPS ── -->
  <div class="powerups" id="powerupsBar" style="display:none;"></div>

  <!-- ── GAME BOARD ── -->
  <div class="board-wrap">
    <div class="board" id="board" data-size="3"></div>
  </div>

  <!-- ── SETUP PANEL ── -->
  <div class="setup" id="setupPanel">
    <div class="setup__title">Simon Dice</div>

    <div class="setup__group">
      <div class="setup__label">Modo de juego</div>
      <div class="option-row">
        <button class="option-btn mode-btn selected" data-mode="classic" onclick="selectMode('classic')">Clasico</button>
        <button class="option-btn mode-btn" data-mode="timeattack" onclick="selectMode('timeattack')">Contrarreloj</button>
        <button class="option-btn mode-btn" data-mode="2p" onclick="selectMode('2p')">2 Jugadores</button>
      </div>
    </div>

    <div class="setup__group">
      <div class="setup__label">Dificultad</div>
      <div class="option-row">
        <button class="option-btn selected" data-difficulty="easy" onclick="selectDifficulty('easy')">Facil</button>
        <button class="option-btn" data-difficulty="medium" onclick="selectDifficulty('medium')">Medio</button>
        <button class="option-btn" data-difficulty="hard" onclick="selectDifficulty('hard')">Dificil</button>
      </div>
    </div>

    <div class="setup__group">
      <div class="setup__label">Velocidad</div>
      <div class="option-row">
        <button class="option-btn selected" data-speed="slow" onclick="selectSpeed('slow')">Lento</button>
        <button class="option-btn" data-speed="normal" onclick="selectSpeed('normal')">Normal</button>
        <button class="option-btn" data-speed="fast" onclick="selectSpeed('fast')">Rapido</button>

// ═══════════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function getFrequency(cellIndex, totalCells) {
  // Pentatonic scale-ish frequencies for pleasant tones
  const baseFreqs = {
    9:  [261, 294, 329, 392, 440, 523, 587, 659, 784],
    16: [261, 277, 294, 311, 329, 349, 370, 392, 415, 440, 466, 494, 523, 554, 587, 622],
    25: [196, 220, 246, 261, 294, 330, 349, 392, 440, 466, 523, 587, 622, 698, 784, 880, 988, 1047, 1175, 1319, 1397, 1568, 1760, 1975, 2093]
  };
  return (baseFreqs[totalCells] || baseFreqs[9])[cellIndex % (totalCells || 9)];
}

function playTone(cellIndex, totalCells, duration = 200) {
  ensureAudio();
  const freq = getFrequency(cellIndex, totalCells);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration / 1000);
}

function playErrorSound() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function playWinSound() {
  ensureAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }, i * 120);
  });
}

function playLoseSound() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

// ═══════════════════════════════════════════════
//  POWER-UPS
// ═══════════════════════════════════════════════
let availablePowerups = [];
let usedPowerupThisTurn = false;

function checkPowerupEarned(level) {
  if (level > 1 && (level - 1) % 3 === 0) {
    const types = ['skip', 'slow', 'double'];
    const earned = types[Math.floor(Math.random() * types.length)];
    availablePowerups.push(earned);
    renderPowerups();
    showPowerupNotification(earned);
  }
}

function showPowerupNotification(type) {
  const icons = { skip: '⏭', slow: '🐢', double: '✖2' };
  const names = { skip: 'Silenciar', slow: 'Ralentizar', double: 'Duplicar' };
  Swal.fire({
    toast: true,
    position: 'top',
    icon: 'info',
    title: `Power-up: ${icons[type]} ${names[type]}`,
    showConfirmButton: false,
    timer: 2000,
    background: 'var(--surface-1)',
    color: 'var(--label)',
  });
}

function renderPowerups() {
  const bar = document.getElementById('powerupsBar');
  bar.innerHTML = '';
  if (availablePowerups.length === 0) return;
  
  const types = [
    { id: 'skip', icon: '⏭', name: 'Silenciar' },
    { id: 'slow', icon: '🐢', name: 'Ralentizar' },
    { id: 'double', icon: '✖2', name: 'Duplicar' }
  ];

  types.forEach(t => {
    const count = availablePowerups.filter(p => p === t.id).length;
    if (count > 0) {
      const btn = document.createElement('button');
      btn.className = 'powerup-btn earned';
      btn.innerHTML = `${t.icon} ${t.name} (${count})`;
      btn.onclick = () => activatePowerup(t.id);
      bar.appendChild(btn);
    }
  });
}

function activatePowerup(type) {
  if (usedPowerupThisTurn || !game || game.waiting === false) return;
  
  const idx = availablePowerups.indexOf(type);
  if (idx === -1) return;

  availablePowerups.splice(idx, 1);
  usedPowerupThisTurn = true;
  renderPowerups();

  // Mark all powerup btns as used visually
  document.querySelectorAll('.powerup-btn').forEach(b => b.classList.add('used'));

  // Apply effect
  if (type === 'skip') {
    game.skipNextColor = true;
    setStatus('⏭ Silenciar activado — siguiente color saltado');
  } else if (type === 'slow') {
    game.tempSpeed = 'slow';
    setStatus('🐢 Ralentizar activado');
  } else if (type === 'double') {
    game.doublePoints = true;
    setStatus('✖2 Duplicar activado — puntos x2 este nivel');
  }

  hapticShort();
}

// ═══════════════════════════════════════════════
//  SIMON GAME CLASS
// ═══════════════════════════════════════════════
class SimonGame {
  constructor(size, lives, maxLevel, lightMs, gapMs, players = 1) {
    this.size     = size;
    this.lives    = lives;
    this.maxLevel = maxLevel;
    this.lightMs  = lightMs;
    this.gapMs    = gapMs;
    this.total    = size * size;
    this.cells    = [];
    this.players  = players;

    this.level       = 1;
    this.score       = 0;
    this.sub         = 0;
    this.livesLeft    = lives;
    this.playing      = false;
    this.waiting      = false;
    this.sequence     = [];
    this.currentPlayer = 1;
    this.scores       = [0, 0];

    // Power-up state
    this.skipNextColor = false;
    this.tempSpeed     = null;
    this.doublePoints  = false;

    // Time attack
    this.timeLeft    = 60;
    this.timerInterval = null;

    // 2P local
    this.playerLives = [lives, lives];

    this._bindCells();
  }

  _bindCells() {
    this.cells = Array.from(document.querySelectorAll('.cell'));
    this.cells.forEach(c => {
      c.addEventListener('click', () => {
        if (!c.classList.contains('locked')) {
          this._click(parseInt(c.dataset.index));
        }
      });
    });
  }

  start() {
    this.playing = true;
    if (config.mode === 'timeattack') {
      this._startTimer();
    }
    this._nextSequence();
  }

  _startTimer() {
    this.timeLeft = 60;
    this.timerInterval = setInterval(() => {
      this.timeLeft -= 0.1;
      this.onTimeUpdate && this.onTimeUpdate(this.timeLeft);
      if (this.timeLeft <= 0) {
        this._lose();
      }
    }, 100);
  }

  _stopTimer() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
  }

  _nextSequence() {
    this.sequence.push(Math.floor(Math.random() * this.total));
    this.sub = 0;
    this.waiting = true;
    this.skipNextColor = false;
    this.tempSpeed = null;
    this.doublePoints = false;
    usedPowerupThisTurn = false;
    this.onWatch && this.onWatch();
    this._playSequence();
  }

  async _playSequence() {
    const seq = this.sequence;
    const speed = this.tempSpeed || config.speed;
    const lightMs = SPEED_LIGHT[speed];
    const gapMs = SPEED_GAP[speed];
    const total = this.total;

    for (let i = 0; i < seq.length; i++) {
      if (this.skipNextColor && i === 0) {
        // Skip the first color in sequence
        this.skipNextColor = false;
        setStatus('⏭ Siguiente color saltado!');
        continue;
      }
      const cellIdx = seq[i];
      const cell = this.cells[cellIdx];
      if (!cell) continue;
      cell.classList.add('light');
      playTone(cellIdx, total, lightMs);
      hapticShort();
      await this._delay(lightMs);
      cell.classList.remove('light');
      if (i < seq.length - 1) await this._delay(gapMs);
    }
    this.waiting = false;
    this.onInput && this.onInput();
  }

  _delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async _click(index) {
    if (!this.playing || this.waiting) return;
    
    const speed = this.tempSpeed || config.speed;
    const lightMs = SPEED_LIGHT[speed];
    
    const cell = this.cells[index];
    cell.classList.add('light');
    playTone(index, this.total, lightMs);
    hapticShort();
    await this._delay(lightMs);
    cell.classList.remove('light');

    // In 2P mode, only current player's cells are active
    if (this.players > 1 && this.currentPlayer === 2) return;

    if (index === this.sequence[this.sub]) {
      this.sub++;
      const points = this.sub * 10 * this._speedBonus() * (this.doublePoints ? 2 : 1);
      this.score += points;
      this.scores[this.currentPlayer - 1] = this.score;
      this.onInputGiven && this.onInputGiven(index, true);
      
      if (this.sub === this.sequence.length) {
        // Level complete
        checkPowerupEarned(this.level);
        this.level++;
        this.onLevel && this.onLevel(this.level);
        this.onScore && this.onScore(this.score);

        if (config.mode !== 'timeattack' && this.level > this.maxLevel) {
          this._win();
          return;
        }

        this.waiting = true;
        await this._delay(800);
        this._nextSequence();
      }
    } else {
      // Wrong
      this._handleWrong();
    }
  }

  async _handleWrong() {
    this.livesLeft--;
    this.onInputGiven && this.onInputGiven(null, false);
    playErrorSound();
    hapticLong();

    if (this.players > 1) {
      this.playerLives[this.currentPlayer - 1]--;
      if (this.playerLives[this.currentPlayer - 1] <= 0) {
        this._lose();
        return;
      }
      // Switch player
      this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
      this.sub = 0;
      this.waiting = true;
      this.onTurnChange && this.onTurnChange(this.currentPlayer);
      loseLife(this.playerLives[this.currentPlayer - 1]);
      setTimeout(() => {
        this.waiting = false;
        this.onInput && this.onInput();
      }, 1000);
      return;
    }

    if (config.mode !== 'timeattack') {
      loseLife(this.livesLeft);
      this.onLose && this.onLose(this.livesLeft);
    }

    if (this.livesLeft <= 0 || (config.mode !== 'timeattack' && this.livesLeft === 0)) {
      this._lose();
      return;
    }

    // Repeat same level
    this.waiting = true;
    this.sub = 0;
    if (config.mode !== 'timeattack') {
      setStatus(`Fallaste! Repite la secuencia`);
    }
    await this._delay(1000);
    this.waiting = false;
    this.onInput && this.onInput();
  }

  _speedBonus() {
    return { slow: 1, normal: 2, fast: 3 }[config.speed] || 1;
  }

  _win() {
    this.playing = false;
    this._stopTimer();
    this.onWin && this.onWin(this.score, this.level, false);
  }

  _lose() {
    this.playing = false;
    this._stopTimer();
    playLoseSound();
    hapticLong();
    spawnRedX(30);
    this.onWin && this.onWin(this.score, this.level, true);
  }

  onLevel()  {}
  onScore()  {}
  onLose()   {}
  onWin()    {}
  onWatch()  {}
  onInput()  {}
  onTurnChange() {}
  onTimeUpdate() {}
  onInputGiven() {}
}

function setStatus(text, blink = false) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.classList.toggle('status--blink', blink);
}

function onLevel(lvl) {
  document.getElementById('statLevel').textContent = lvl;
}

function onScore(score) {
  document.getElementById('statScore').textContent = score;
}

function onWatch() {
  setStatus('Observa la secuencia...', true);
}

function onInput() {
  setStatus('Tu turno — repite la secuencia');
}

function onInputGiven(index, correct) {
  if (!correct) {
    setStatus('Incorrecto!', false);
  }
}

function onLose(remaining) {
  if (remaining > 0) {
    setStatus(`Fallaste! Te quedan ${remaining} vida${remaining > 1 ? 's' : ''}`);
  }
}

function onTurnChange(player) {
  const el = document.getElementById('turnIndicator');
  el.textContent = `Jugador ${player} — Tu turno`;
  el.className = `turn-indicator p${player}`;
  el.style.display = 'block';
}

function onTimeUpdate(time) {
  const fill = document.getElementById('timerFill');
  const pct = (time / 60) * 100;
  fill.style.width = pct + '%';
  fill.classList.remove('warning', 'danger');
  if (time <= 10) fill.classList.add('danger');
  else if (time <= 20) fill.classList.add('warning');
}

function onWin(score, level, lost) {
  this.playing = false;
  const modal = document.getElementById('modal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const scoreEl = document.getElementById('modalScore');
  const subtitle = document.getElementById('modalSubtitle');
  const modalStats = document.getElementById('modalStats');
  const modalAch = document.getElementById('modalAchievements');

  if (!lost) {
    playWinSound();
    hapticWin();
    spawnConfetti(60);
    icon.textContent = '🏆';
    title.textContent = 'Ganaste!';
    subtitle.textContent = `Llegaste al nivel ${this.maxLevel}`;
  } else {
    icon.textContent = '💀';
    title.textContent = 'Perdiste!';
    subtitle.textContent = config.mode === 'timeattack' 
      ? `Tiempo agotado — Nivel ${level}` 
      : `Nivel alcanzado: ${level - 1}`;
  }

  scoreEl.textContent = score;
  
  // Stats
  modalStats.innerHTML = `
    <div class="modal__stat"><div class="modal__stat-label">Nivel</div><div class="modal__stat-value">${level - (lost ? 1 : 0)}</div></div>
    <div class="modal__stat"><div class="modal__stat-label">Velocidad</div><div class="modal__stat-value">${SPEED_DISPLAY[config.speed]}</div></div>
    <div class="modal__stat"><div class="modal__stat-label">Modo</div><div class="modal__stat-value">${MODE_NAMES[config.mode]}</div></div>
  `;

  // Achievements
  const achs = checkAchievements(score, level, lost);
  modalAch.innerHTML = achs.map(a => `
    <div class="achievement ${a.unlocked ? 'unlocked' : ''}">
      <div class="achievement__icon">${a.icon}</div>
      <div class="achievement__name">${a.name}</div>
    </div>
  `).join('');

  // Save score
  saveScore(score, level, config.mode, config.difficulty, config.size);

  modal.style.display = 'flex';
  setStatus('');
}

const ACHIEVEMENTS = [
  { id: 'first_win', name: 'Primera Victoria', icon: '🎯', check: (s,l,tot) => tot > 0 },
  { id: 'streak_5', name: 'Racha x5', icon: '🔥', check: (s,l,tot) => getStreak() >= 5 },
  { id: 'level_10', name: 'Nivel 10', icon: '⭐', check: (s,l,tot) => l >= 10 },
  { id: 'perfect', name: 'Perfecto', icon: '💎', check: (s,l,tot,cfg) => cfg.difficulty === 'hard' && tot === false },
  { id: 'speedster', name: 'Velocista', icon: '⚡', check: (s,l,tot,cfg) => cfg.speed === 'fast' && tot === false },
  { id: 'multitask', name: 'Multitask', icon: '🎪', check: (s,l,tot,cfg) => cfg.size === 5 && tot === false },
];

function checkAchievements(score, level, lost) {
  return ACHIEVEMENTS.map(a => ({
    ...a,
    unlocked: a.check(score, level, lost, config)
  }));
}

function getStreak() {
  return parseInt(localStorage.getItem('simon_streak') || '0');
}

function updateStreak(won) {
  if (won) {
    const s = getStreak() + 1;
    localStorage.setItem('simon_streak', s.toString());
  } else {
    localStorage.setItem('simon_streak', '0');
  }
}

function getScores() {
  try {
    return JSON.parse(localStorage.getItem('simon_scores') || '[]');
  } catch { return []; }
}

function saveScore(score, level, mode, difficulty, size) {
  const scores = getScores();
  const entry = {
    name: 'Anonimo',
    score,
    level,
    mode,
    difficulty,
    size,
    date: new Date().toLocaleDateString('es-ES'),
  };
  scores.push(entry);
  scores.sort((a, b) => b.score - a.score);
  const top10 = scores.slice(0, 10);
  localStorage.setItem('simon_scores', JSON.stringify(top10));
  
  // Unlock first win
  const achs = JSON.parse(localStorage.getItem('simon_achs') || '[]');
  if (!achs.includes('first_win') && score > 0) {
    achs.push('first_win');
    localStorage.setItem('simon_achs', JSON.stringify(achs));
  }
  
  updateStreak(score > 0);
}

function getSavedAchievements() {
  try {
    return JSON.parse(localStorage.getItem('simon_achs') || '[]');
  } catch { return []; }
}

let currentRoom = null;
let isHost = false;

function showOnlinePanel() {
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('onlinePanel').style.display = '';
  document.getElementById('onlineCreate').style.display = '';
  document.getElementById('onlineJoin').style.display = 'none';
  document.getElementById('onlineWaiting').style.display = 'none';
  document.getElementById('onlineInGame').style.display = 'none';
}

function backFromOnline() {
  document.getElementById('onlinePanel').style.display = 'none';
  document.getElementById('setupPanel').style.display = '';
  cancelOnline();
}

function generateRoomCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

async function createOnlineRoom() {
  if (!firebaseDb) {
    Swal.fire({
      icon: 'error',
      title: 'Firebase no disponible',
      text: 'El multijugador online requiere configuracion de Firebase. Usando modo offline.',
      background: 'var(--surface-1)',
      color: 'var(--label)',
    });
    return;
  }

  const code = generateRoomCode();
  currentRoom = code;
  isHost = true;

  document.getElementById('onlineCreate').style.display = 'none';
  document.getElementById('onlineJoin').style.display = 'none';
  document.getElementById('onlineWaiting').style.display = '';
  document.getElementById('roomCodeDisplay').textContent = code;

  try {
    const roomRef = firebaseDb.ref('rooms/' + code);
    await roomRef.set({
      host: 'pending',
      guest: 'pending',
      state: 'waiting',
      config: { difficulty: config.difficulty, size: config.size, speed: config.speed },
      sequence: [],
      currentTurn: 1,
      hostScore: 0,
      guestScore: 0,
      hostReady: false,
      guestReady: false,
    });

    roomRef.on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return;

      if (data.state === 'playing' && data.guest !== 'pending') {
        // Both players connected, start game
        document.getElementById('onlineWaiting').style.display = 'none';
        document.getElementById('onlineInGame').style.display = '';
        document.getElementById('p1Name').textContent = 'Tu (Host)';
        document.getElementById('p2Name').textContent = 'Invitado';
        startOnlineGame(code, isHost);
      }

      if (data.state === 'finished') {
        showOnlineResults(data.hostScore, data.guestScore);
        roomRef.off();
        roomRef.remove();
      }

      if (data.hostScore !== undefined) {
        document.getElementById('p1OnlineScore').textContent = data.hostScore;
      }
      if (data.guestScore !== undefined) {
        document.getElementById('p2OnlineScore').textContent = data.guestScore;
      }
    });

    currentRoomRef = roomRef;
  } catch(e) {
    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: 'No se pudo crear la sala: ' + e.message,
      background: 'var(--surface-1)',
      color: 'var(--label)',
    });
  }
}

async function joinOnlineRoom() {
  if (!firebaseDb) {
    Swal.fire({
      icon: 'error',
      title: 'Firebase no disponible',
      text: 'El multijugador online requiere configuracion de Firebase.',
      background: 'var(--surface-1)',
      color: 'var(--label)',
    });
    return;
  }

  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if (code.length !== 6) {
    Swal.fire({
      icon: 'warning',
      title: 'Codigo invalido',
      text: 'Ingresa un codigo de 6 digitos',
      background: 'var(--surface-1)',
      color: 'var(--label)',
    });
    return;
  }

  currentRoom = code;
  isHost = false;

  document.getElementById('onlineCreate').style.display = 'none';
  document.getElementById('onlineJoin').style.display = 'none';
  document.getElementById('onlineWaiting').style.display = '';
  document.getElementById('onlineWaitingText').textContent = 'Conectando...';

  try {
    const roomRef = firebaseDb.ref('rooms/' + code);
    const snapshot = await roomRef.once('value');
    const data = snapshot.val();

    if (!data || data.state === 'waiting') {
      await roomRef.update({
        guest: 'connected',
        state: data.state === 'waiting' ? 'playing' : 'waiting'
      });

      document.getElementById('onlineWaiting').style.display = 'none';
      document.getElementById('onlineInGame').style.display = '';
      document.getElementById('p1Name').textContent = 'Host';
      document.getElementById('p2Name').textContent = 'Tu (Invitado)';

      startOnlineGame(code, isHost);
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Sala no disponible',
        text: 'La sala esta llena o ya inicio',
        background: 'var(--surface-1)',
        color: 'var(--label)',
      });
      backFromOnline();
    }
  } catch(e) {
    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: 'No se pudo unir a la sala',
      background: 'var(--surface-1)',
      color: 'var(--label)',
    });
  }
}

function cancelOnline() {
  if (currentRoomRef) {
    currentRoomRef.off();
    currentRoomRef.remove().catch(() => {});
    currentRoomRef = null;
  }
  currentRoom = null;
  isHost = false;
}

let currentRoomRef = null;
let onlineGameInterval = null;

function startOnlineGame(roomCode, amHost) {
  // For simplicity, the host controls the game flow
  // This is a simplified version - full sync requires more complex logic
  if (amHost) {
    // Host starts the game after both join
    setTimeout(() => {
      document.getElementById('onlineInGame').style.display = 'none';

function updateOnlineScore(player, score) {
  if (!currentRoom || !firebaseDb) return;
  const update = {};
  update[player === 1 ? 'hostScore' : 'guestScore'] = score;
  firebaseDb.ref('rooms/' + currentRoom).update(update);
}

function showOnlineResults(hostScore, guestScore) {
  const youScore = isHost ? hostScore : guestScore;
  const otherScore = isHost ? guestScore : hostScore;
  const won = youScore > otherScore;

  Swal.fire({
    title: won ? '🎉 Ganaste!' : (youScore === otherScore ? '🤝 Empate!' : '💀 Perdiste'),
    html: `
      <div class="online-scoreboard">
        <div class="online-player">
          <div class="online-player__name">Tu</div>
          <div class="online-player__score">${youScore}</div>
        </div>
        <div class="online-player">
          <div class="online-player__name">Rival</div>
          <div class="online-player__score p2">${otherScore}</div>
        </div>
      </div>
    `,
    background: 'var(--surface-1)',
    color: 'var(--label)',
    confirmButtonColor: 'var(--blue)',
    confirmButtonText: 'Volver',
  }).then(() => {
    backFromOnline();
  });

  if (firebaseDb && currentRoom) {
    firebaseDb.ref('rooms/' + currentRoom).remove().catch(() => {});
  }
}
