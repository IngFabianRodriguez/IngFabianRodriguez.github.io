<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Dice</title>
  <style>
/* ── Apple Design Language Dark ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #000000;
  --surface-1:   #1c1c1e;
  --surface-2:   #2c2c2e;
  --surface-3:   #3a3a3c;
  --label:       #f5f5f7;
  --secondary:   #98989d;
  --tertiary:    #636366;
  --blue:        #0a84ff;
  --blue-fill:   rgba(10,132,255,0.15);
  --green:       #30d158;
  --red:         #ff453a;
  --orange:      #ff9f0a;
  --yellow:      #ffd60a;
  --purple:      #bf5af2;
  --pink:        #ff375f;
  --cyan:        #64d2ff;
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-xl:   20px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-apple:  cubic-bezier(0.25, 0.1, 0.25, 1.0);
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #48484a; border-radius: 3px; }
::selection { background: var(--blue-fill); }

/* ── Layout ── */
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 16px;
  gap: 24px;
}

/* ── Header Stats ── */
.stats {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.stat {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  padding: 10px 20px;
  text-align: center;
  min-width: 90px;
  border: 1px solid var(--surface-3);
}
.stat__label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--secondary);
  margin-bottom: 4px;
}
.stat__value {
  font-size: 24px;
  font-weight: 700;
  color: var(--label);
}
.stat__value--blue  { color: var(--blue); }
.stat__value--red   { color: var(--red); }
.stat__value--green { color: var(--green); }
.stat__value--orange{ color: var(--orange); }

/* ── Status bar ── */
.status {
  font-size: 14px;
  color: var(--secondary);
  height: 20px;
  text-align: center;
}
.status--blink {
  animation: blink 1s ease infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ── Game Board ── */
.board-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.board {
  display: grid;
  gap: 8px;
  width: min(70vmin, 400px);
  height: min(70vmin, 400px);
}

/* 3×3 = 9 casillas */
.board[data-size="3"]  { grid-template-columns: repeat(3, 1fr); }
/* 4×4 = 16 casillas */
.board[data-size="4"]  { grid-template-columns: repeat(4, 1fr); }
/* 5×5 = 25 casillas */
.board[data-size="5"]  { grid-template-columns: repeat(5, 1fr); }

.cell {
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.12s var(--ease-spring),
              filter 0.12s var(--ease-apple),
              box-shadow 0.12s var(--ease-apple);
  position: relative;
  overflow: hidden;
  border: none;
  outline: none;
}

.cell::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: rgba(255,255,255,0);
  transition: background 0.12s;
}

.cell:active::after {
  background: rgba(255,255,255,0.15);
}

.cell.light {
  transform: scale(0.96);
  filter: brightness(1.6);
  box-shadow: 0 0 24px 6px currentColor;
}

/* ── Cell Colors (dark base, bright lit) ── */
.cell-0  { background: #22a6b3; color: #22a6b3; }
.cell-1  { background: #be2edd; color: #be2edd; }
.cell-2  { background: #f0932b; color: #f0932b; }
.cell-3  { background: #6ab04c; color: #6ab04c; }
.cell-4  { background: #eb4d4b; color: #eb4d4b; }
.cell-5  { background: #30336b; color: #30336b; }
.cell-6  { background: #f9ca24; color: #f9ca24; }
.cell-7  { background: #6c5ce7; color: #6c5ce7; }
.cell-8  { background: #00b894; color: #00b894; }
.cell-9  { background: #e17055; color: #e17055; }
.cell-10 { background: #0984e3; color: #0984e3; }
.cell-11 { background: #d63031; color: #d63031; }
.cell-12 { background: #00cec9; color: #00cec9; }
.cell-13 { background: #e84393; color: #e84393; }
.cell-14 { background: #55a3ff; color: #55a3ff; }
.cell-15 { background: #fd79a8; color: #fd79a8; }
.cell-16 { background: #a29bfe; color: #a29bfe; }
.cell-17 { background: #00b894; color: #00b894; }
.cell-18 { background: #e17055; color: #e17055; }
.cell-19 { background: #74b9ff; color: #74b9ff; }
.cell-20 { background: #fdcb6e; color: #fdcb6e; }
.cell-21 { background: #fab1a0; color: #fab1a0; }
.cell-22 { background: #55efc4; color: #55efc4; }
.cell-23 { background: #a29bfe; color: #a29bfe; }
.cell-24 { background: #fd79a8; color: #fd79a8; }

/* ── Setup Panel ── */
.setup {
  background: var(--surface-1);
  border-radius: var(--radius-xl);
  padding: 28px;
  width: min(460px, 100%);
  border: 1px solid var(--surface-3);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.setup__title {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.01em;
}

.setup__group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.setup__label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--secondary);
}

.option-row {
  display: flex;
  gap: 8px;
}

.option-btn {
  flex: 1;
  padding: 10px 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--surface-3);
  background: var(--surface-2);
  color: var(--secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s var(--ease-apple);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.option-btn:hover {
  background: var(--surface-3);
  color: var(--label);
}

.option-btn.selected {
  background: var(--blue-fill);
  border-color: var(--blue);
  color: var(--blue);
  font-weight: 600;
}

/* ── Play Button ── */
.btn-play {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-md);
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  transition: background 0.15s, transform 0.12s var(--ease-spring);
}

.btn-play:hover { background: #2680ff; transform: scale(1.01); }
.btn-play:active { transform: scale(0.98); }

/* ── Game Over Overlay ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--surface-1);
  border-radius: var(--radius-xl);
  padding: 36px 28px;
  width: min(380px, 90vw);
  border: 1px solid var(--surface-3);
  text-align: center;
  animation: scaleIn 0.25s var(--ease-spring);
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.88); }
  to { opacity: 1; transform: scale(1); }
}

.modal__icon {
  font-size: 56px;
  margin-bottom: 12px;
}

.modal__title {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 8px;
}

.modal__score {
  font-size: 48px;
  font-weight: 700;
  color: var(--orange);
  margin: 12px 0;
}

.modal__subtitle {
  font-size: 14px;
  color: var(--secondary);
  margin-bottom: 24px;
}

.modal__btn {
  width: 100%;
  padding: 13px;
  border-radius: var(--radius-md);
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  margin-bottom: 10px;
  transition: background 0.15s;
}

.modal__btn:hover { background: #2680ff; }
.modal__btn--ghost {
  background: var(--surface-2);
  color: var(--secondary);
  margin-bottom: 0;
}
.modal__btn--ghost:hover { background: var(--surface-3); color: var(--label); }

/* ── Lives ── */
.lives {
  display: flex;
  gap: 6px;
  justify-content: center;
}
.life {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--red);
  transition: all 0.3s var(--ease-spring);
}
.life.lost {
  background: var(--surface-3);
  transform: scale(0.8);
}

/* ── Difficulty description ── */
.difficulty-desc {
  font-size: 12px;
  color: var(--tertiary);
  text-align: center;
  margin-top: -8px;
}

/* ── Responsive ── */
@media (max-height: 700px) {
  .app { gap: 12px; padding: 12px; }
  .setup { padding: 20px; }
}
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- ── STATS BAR ── -->
  <div class="stats" id="statsBar">
    <div class="stat">
      <div class="stat__label">Nivel</div>
      <div class="stat__value stat__value--blue" id="statLevel">1</div>
    </div>
    <div class="stat">
      <div class="stat__label">Puntos</div>
      <div class="stat__value stat__value--orange" id="statScore">0</div>
    </div>
    <div class="stat">
      <div class="stat__label">Vidas</div>
      <div class="lives" id="livesContainer">
        <div class="life" id="life0"></div>
        <div class="life" id="life1"></div>
        <div class="life" id="life2"></div>
      </div>
    </div>
  </div>

  <!-- ── STATUS ── -->
  <div class="status" id="statusText">Configura y presiona JUGAR</div>

  <!-- ── GAME BOARD ── -->
  <div class="board-wrap">
    <div class="board" id="board" data-size="3"></div>
  </div>

  <!-- ── SETUP PANEL ── -->
  <div class="setup" id="setupPanel">
    <div class="setup__title">Simon Dice</div>

    <div class="setup__group">
      <div class="setup__label">Dificultad</div>
      <div class="option-row">
        <button class="option-btn selected" data-difficulty="easy"   onclick="selectDifficulty('easy')">Facil</button>
        <button class="option-btn"           data-difficulty="medium" onclick="selectDifficulty('medium')">Medio</button>
        <button class="option-btn"           data-difficulty="hard"  onclick="selectDifficulty('hard')">Dificil</button>
      </div>
    </div>

    <div class="setup__group">
      <div class="setup__label">Velocidad</div>
      <div class="option-row">
        <button class="option-btn selected" data-speed="slow"   onclick="selectSpeed('slow')">Lento</button>
        <button class="option-btn"           data-speed="normal" onclick="selectSpeed('normal')">Normal</button>
        <button class="option-btn"           data-speed="fast"  onclick="selectSpeed('fast')">Rapido</button>
      </div>
    </div>

    <div class="setup__group">
      <div class="setup__label">Casillas</div>
      <div class="option-row">
        <button class="option-btn selected" data-size="3" onclick="selectSize(3)">3×3 (9)</button>
        <button class="option-btn"           data-size="4" onclick="selectSize(4)">4×4 (16)</button>
        <button class="option-btn"           data-size="5" onclick="selectSize(5)">5×5 (25)</button>
      </div>
    </div>

    <div class="difficulty-desc" id="difficultyDesc">
      Facil: 3 vidas · Secuencia mas corta
    </div>

    <button class="btn-play" onclick="startGame()">JUGAR</button>
  </div>

  <!-- ── MODAL (hidden) ── -->
  <div class="overlay" id="modal" style="display:none;">
    <div class="modal">
      <div class="modal__icon" id="modalIcon">🏆</div>
      <div class="modal__title" id="modalTitle">Ganaste!</div>
      <div class="modal__score" id="modalScore">0</div>
      <div class="modal__subtitle" id="modalSubtitle">Puntos totales</div>
      <button class="modal__btn" onclick="replayGame()">Jugar de nuevo</button>
      <button class="modal__btn modal__btn--ghost" onclick="backToSetup()">Cambiar config</button>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────
//  State
// ─────────────────────────────────────────
let config = {
  difficulty: 'easy',    // easy | medium | hard
  speed:      'normal',  // slow | normal | fast
  size:       3,         // 3 | 4 | 5
};

let game = null;

// ─────────────────────────────────────────
//  Config
// ─────────────────────────────────────────
const DIFFICULTY_LIVES   = { easy: 3, medium: 2, hard: 1 };
const DIFFICULTY_MAXLEVEL= { easy: 20, medium: 30, hard: 50 };
const SPEED_LIGHT        = { slow: 600, normal: 350, fast: 180 };
const SPEED_GAP          = { slow: 400, normal: 250, fast: 120 };

const DIFFICULTY_DESCS = {
  easy:   'Facil: 3 vidas · Para principiantes',
  medium: 'Medio: 2 vidas · Un desafio moderado',
  hard:   'Dificil: 1 vida · Solo para expertos',
};

function selectDifficulty(d) {
  config.difficulty = d;
  document.querySelectorAll('[data-difficulty]').forEach(b =>
    b.classList.toggle('selected', b.dataset.difficulty === d));
  document.getElementById('difficultyDesc').textContent = DIFFICULTY_DESCS[d];
}

function selectSpeed(s) {
  config.speed = s;
  document.querySelectorAll('[data-speed]').forEach(b =>
    b.classList.toggle('selected', b.dataset.speed === s));
}

function selectSize(n) {
  config.size = n;
  document.querySelectorAll('[data-size]').forEach(b => {
    if (b.tagName === 'BUTTON')
      b.classList.toggle('selected', parseInt(b.dataset.size) === n);
  });
  document.getElementById('board').dataset.size = n;
  buildBoard(n);
}

// ─────────────────────────────────────────
//  Board
// ─────────────────────────────────────────
function buildBoard(size) {
  const board = document.getElementById('board');
  const total = size * size;
  board.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const btn = document.createElement('button');
    btn.className = `cell cell-${i % 25}`;
    btn.dataset.index = i;
    btn.setAttribute('aria-label', `Casilla ${i + 1}`);
    board.appendChild(btn);
  }
}

// ─────────────────────────────────────────
//  Lives UI
// ─────────────────────────────────────────
function renderLives(lives, max) {
  const container = document.getElementById('livesContainer');
  container.innerHTML = '';
  for (let i = 0; i < max; i++) {
    const d = document.createElement('div');
    d.className = 'life' + (i >= lives ? ' lost' : '');
    d.id = `life${i}`;
    container.appendChild(d);
  }
}

function loseLife(lifeIndex) {
  const el = document.getElementById(`life${lifeIndex}`);
  if (el) el.classList.add('lost');
}

// ─────────────────────────────────────────
//  Game
// ─────────────────────────────────────────
function startGame() {
  buildBoard(config.size);
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('modal').style.display = 'none';

  const lives = DIFFICULTY_LIVES[config.difficulty];
  const maxLevel = DIFFICULTY_MAXLEVEL[config.difficulty];
  const lightMs = SPEED_LIGHT[config.speed];
  const gapMs = SPEED_GAP[config.speed];

  game = new SimonGame(config.size, lives, maxLevel, lightMs, gapMs);
  game.onLevel  = onLevel;
  game.onScore = onScore;
  game.onLose  = onLose;
  game.onWin   = onWin;
  game.onWatch = onWatch;
  game.onInput = onInput;

  renderLives(lives, lives);
  game.start();
}

function replayGame() {
  startGame();
}

function backToSetup() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('setupPanel').style.display = '';
  document.getElementById('board').innerHTML = '';
  game = null;
  document.getElementById('statLevel').textContent = '1';
  document.getElementById('statScore').textContent = '0';
}

// ─────────────────────────────────────────
//  SimonGame Class
// ─────────────────────────────────────────
class SimonGame {
  constructor(size, lives, maxLevel, lightMs, gapMs) {
    this.size     = size;
    this.lives    = lives;
    this.maxLevel = maxLevel;
    this.lightMs  = lightMs;
    this.gapMs    = gapMs;
    this.total    = size * size;
    this.cells    = [];

    this.level    = 1;
    this.score    = 0;
    this.sub      = 0;
    this.livesLeft = lives;
    this.playing  = false;
    this.waiting  = false;
    this.sequence  = [];

    this._bindCells();
  }

  _bindCells() {
    this.cells = Array.from(document.querySelectorAll('.cell'));
    this.cells.forEach(c => {
      c.addEventListener('click', () => this._click(parseInt(c.dataset.index)));
    });
  }

  start() {
    this.playing = true;
    this._nextSequence();
  }

  _nextSequence() {
    this.sequence.push(Math.floor(Math.random() * this.total));
    this.sub = 0;
    this.waiting = true;
    this.onWatch && this.onWatch();
    this._playSequence();
  }

  async _playSequence() {
    const seq = this.sequence;
    for (let i = 0; i < seq.length; i++) {
      await this._flash(seq[i]);
      if (i < seq.length - 1) await this._delay(this.gapMs);
    }
    this.waiting = false;
    this.onInput && this.onInput();
  }

  async _flash(index) {
    const cell = this.cells[index];
    if (!cell) return;
    cell.classList.add('light');
    await this._delay(this.lightMs);
    cell.classList.remove('light');
  }

  _delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async _click(index) {
    if (!this.playing || this.waiting) return;
    await this._flash(index);

    if (index === this.sequence[this.sub]) {
      this.sub++;
      if (this.sub === this.sequence.length) {
        // Level complete
        this.score += this.sub * 10 * this._speedBonus();
        this.level++;
        this.onLevel && this.onLevel(this.level);
        this.onScore && this.onScore(this.score);

        if (this.level > this.maxLevel) {
          this._win();
          return;
        }

        this.waiting = true;
        await this._delay(900);
        this._nextSequence();
      }
    } else {
      // Wrong
      this.livesLeft--;
      loseLife(this.livesLeft);
      this.onLose && this.onLose(this.livesLeft);

      if (this.livesLeft <= 0) {
        this._lose();
        return;
      }

      // Repeat same level
      this.waiting = true;
      this.sub = 0;
      await this._delay(1000);
      this.waiting = false;
      this.onInput && this.onInput();
    }
  }

  _speedBonus() {
    return { slow: 1, normal: 2, fast: 3 }[config.speed] || 1;
  }

  _win() {
    this.playing = false;
    this.onWin && this.onWin(this.score, this.level);
  }

  _lose() {
    this.playing = false;
    this.onWin && this.onWin(this.score, this.level, true);
  }

  onLevel()  {}
  onScore()  {}
  onLose()   {}
  onWin()    {}
  onWatch()  {}
  onInput()  {}
}

// ─────────────────────────────────────────
//  UI Callbacks
// ─────────────────────────────────────────
function setStatus(text, blink = false) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.classList.toggle('status--blink', blink);
}

function onLevel(lvl) {
  document.getElementById('statLevel').textContent = lvl;
}

function onScore(score) {
  document.getElementById('statScore').textContent = score;
}

function onWatch() {
  setStatus('Observa la secuencia...', true);
}

function onInput() {
  setStatus('Tu turno — repiti la secuencia');
}

function onLose(remaining) {
  if (remaining > 0) {
    setStatus(`Fallaste! Te quedan ${remaining} vida${remaining > 1 ? 's' : ''}`);
  }
}

function onWin(score, level, lost = false) {
  this.playing = false;
  const modal = document.getElementById('modal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const scoreEl = document.getElementById('modalScore');
  const subtitle = document.getElementById('modalSubtitle');

  if (lost) {
    icon.textContent = '💀';
    title.textContent = 'Perdiste!';
    subtitle.textContent = `Nivel alcanzado: ${level - 1}`;
  } else {
    icon.textContent = '🏆';
    title.textContent = 'Ganaste!';
    subtitle.textContent = `Llegaste al nivel ${this.maxLevel}`;
  }

  scoreEl.textContent = score;
  modal.style.display = 'flex';
  setStatus('');
}

// Fix onWin context
onWin = function(score, level, lost = false) {
  const modal = document.getElementById('modal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const scoreEl = document.getElementById('modalScore');
  const subtitle = document.getElementById('modalSubtitle');

  if (lost) {
    icon.textContent = '💀';
    title.textContent = 'Perdiste!';
    subtitle.textContent = `Nivel alcanzado: ${level - 1}`;
  } else {
    icon.textContent = '🏆';
    title.textContent = 'Ganaste!';
    subtitle.textContent = `Llegaste al nivel ${DIFFICULTY_MAXLEVEL[config.difficulty]}`;
  }

  scoreEl.textContent = score;
  modal.style.display = 'flex';
  setStatus('');
};
